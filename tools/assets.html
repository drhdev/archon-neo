<!doctype html>
<!--
  Renders the PNG assets (app icons, social preview) from the game's own artwork.
  Used by scripts/render-assets.sh with headless Chrome:  assets.html?asset=og|icon|maskable&size=N
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Archon NEO asset renderer</title>
  <style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { unitCanvas } from '../public/js/art.js';
import { makeFloor, makeRock } from '../public/js/arena-art.js';

const q = new URLSearchParams(location.search);
const asset = q.get('asset') || 'og';
const size = Number(q.get('size') || 512);
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const SERIF = 'ui-serif, "New York", Georgia, Cambria, "Noto Serif", "Times New Roman", serif';

function unit(type, pal, cx, cy, s, flip = false) {
  const img = unitCanvas(type, pal, s * 2);
  ctx.save();
  ctx.translate(cx, cy);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function emblem(cx, cy, r) {
  const gl = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  gl.addColorStop(0, '#fff3c4'); gl.addColorStop(1, '#ff9d2e');
  const gd = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  gd.addColorStop(0, '#d6c2ff'); gd.addColorStop(1, '#6b3cff');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx - r, cy); ctx.lineTo(cx, cy + r); ctx.closePath(); ctx.fill();
  ctx.fillStyle = gd;
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.closePath(); ctx.fill();
  const i = r * 0.46;
  ctx.fillStyle = '#07060f';
  ctx.strokeStyle = '#5ff7e6';
  ctx.lineWidth = r * 0.08;
  ctx.beginPath(); ctx.moveTo(cx, cy - i); ctx.lineTo(cx + i, cy); ctx.lineTo(cx, cy + i); ctx.lineTo(cx - i, cy); ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function icon(full) {
  cv.width = cv.height = size;
  ctx.fillStyle = '#07060f';
  if (full) ctx.fillRect(0, 0, size, size);
  else { ctx.beginPath(); ctx.roundRect(0, 0, size, size, size * 0.22); ctx.fill(); }
  const glow = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.6);
  glow.addColorStop(0, 'rgba(120,70,255,0.35)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, size, size);
  emblem(size / 2, size / 2, size * (full ? 0.3 : 0.38));
}

function og() {
  const w = 1200, h = 630, GROUND = 545;
  cv.width = w; cv.height = h;
  const bg = ctx.createLinearGradient(0, 0, w, 0);
  bg.addColorStop(0, '#1e1406'); bg.addColorStop(0.5, '#07060f'); bg.addColorStop(1, '#150a30');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.fillStyle = '#c8c0ff';
  for (let i = 0; i < 170; i++) { ctx.globalAlpha = 0.15 + rnd() * 0.5; ctx.fillRect(rnd() * w, rnd() * GROUND * 0.9, 1 + rnd() * 1.6, 1 + rnd() * 1.6); }
  ctx.globalAlpha = 1;

  // the arena floor of 1.1, seen at a low angle, fading into the night
  const floor = makeFloor(600, 120, 2, [96, 84, 140], 0.35, 'light', 3);
  // simple perspective: strips get taller and wider towards the viewer
  const top = GROUND - 150, depth = h - top, N = 90;
  for (let i = 0; i < N; i++) {
    const t0 = i / N, t1 = (i + 1) / N;
    const y0 = top + depth * t0 * t0, y1 = top + depth * t1 * t1;
    const sw = w * (0.9 + 0.7 * t0);
    ctx.drawImage(floor, 0, floor.height * t0, floor.width, floor.height / N + 1, (w - sw) / 2, y0, sw, y1 - y0 + 1);
  }
  let fade = ctx.createLinearGradient(0, GROUND - 160, 0, GROUND - 20);
  fade.addColorStop(0, 'rgba(7,6,15,1)'); fade.addColorStop(1, 'rgba(7,6,15,0)');
  ctx.fillStyle = fade; ctx.fillRect(0, GROUND - 161, w, 142);
  fade = ctx.createLinearGradient(0, h - 70, 0, h);
  fade.addColorStop(0, 'rgba(7,6,15,0)'); fade.addColorStop(1, 'rgba(7,6,15,0.85)');
  ctx.fillStyle = fade; ctx.fillRect(0, h - 70, w, 70);

  // warm and cold light of the two armies
  for (const [x, col] of [[200, 'rgba(255,175,55,0.32)'], [1000, 'rgba(140,80,255,0.36)']]) {
    const g = ctx.createRadialGradient(x, 400, 0, x, 400, 380);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  // stone pillars between the armies
  const rock = (x, y, r, s) => {
    const k = makeRock(r, 2, s);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(x + r * 0.15, y + r * 0.62, r * 1.05, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(k.cv, x - k.size / 2, y - k.size / 2, k.size, k.size);
    const rg = ctx.createRadialGradient(x + k.ax, y + k.ay, 0, x + k.ax, y + k.ay, r * 0.5);
    rg.addColorStop(0, 'rgba(95,247,230,0.55)'); rg.addColorStop(1, 'rgba(95,247,230,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  };
  rock(498, GROUND - 6, 40, 4);
  rock(712, GROUND + 18, 30, 9);

  // armies standing on the floor
  const fig = (type, pal, x, s, flip) => {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(x, GROUND + s * 0.02, s * 0.3, s * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.shadowColor = pal === 'light' ? 'rgba(255,190,70,0.55)' : 'rgba(160,90,255,0.6)';
    ctx.shadowBlur = 28;
    unit(type, pal, x, GROUND - s * 0.44, s, flip);
    ctx.restore();
  };
  fig('wizard', 'light', 205, 300);
  fig('knight', 'light', 70, 170);
  fig('unicorn', 'light', 345, 180);
  fig('sorceress', 'dark', 995, 300, true);
  fig('dragon', 'dark', 1125, 190, true);
  fig('goblin', 'dark', 855, 165, true);

  // title
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tg = ctx.createLinearGradient(0, 110, 0, 220);
  tg.addColorStop(0, '#fff6d0'); tg.addColorStop(0.5, '#ffd76a'); tg.addColorStop(0.62, '#b48cff'); tg.addColorStop(1, '#6b3cff');
  ctx.shadowColor = 'rgba(180,140,255,0.6)'; ctx.shadowBlur = 32;
  ctx.fillStyle = tg;
  ctx.font = `900 136px ${FONT}`;
  ctx.fillText('ARCHON', w / 2, 160);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#9b74ff';
  ctx.font = `800 42px ${FONT}`;
  ctx.fillText('N  E  O', w / 2, 258);
  ctx.fillStyle = '#f1ecff';
  ctx.font = `italic 600 36px ${SERIF}`;
  ctx.fillText('Light vs. Dark', w / 2, 330);
  ctx.fillStyle = 'rgba(236,232,255,0.72)';
  ctx.font = `italic 400 23px ${SERIF}`;
  ctx.fillText('Strategy on a magic board · real-time arena duels', w / 2, 376);
  emblem(w / 2, 440, 26);
  // footer badge
  ctx.font = `600 16px ${FONT}`;
  const tag = 'Free  ·  iPhone  ·  Android  ·  Desktop  ·  English & Deutsch';
  const tw = ctx.measureText(tag).width + 44;
  ctx.fillStyle = 'rgba(10,8,22,0.72)';
  ctx.strokeStyle = 'rgba(155,116,255,0.45)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(w / 2 - tw / 2, 588, tw, 30, 15); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(236,232,255,0.82)';
  ctx.fillText(tag, w / 2, 604);
}

if (asset === 'og') og();
else icon(asset === 'maskable');
document.title = 'ready';
</script>
</body>
</html>
