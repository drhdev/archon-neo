# Archon NEO – nginx site configuration (static files, port 8080, behind a TLS proxy such as Coolify/Traefik).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1k;
    keepalive_timeout 30s;

    # Compression for text assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;

    # Security headers (repeated in every location that sets its own headers)
    include /etc/nginx/security-headers.conf;
    # HTML, JS, CSS: always revalidate (cheap 304 via ETag) so releases go live immediately.
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;

    # Liveness/readiness probe for Docker, Coolify and load balancers
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    # Service worker must never be cached by the HTTP cache
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Images & icons: rarely change, cache for 30 days
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Never serve dotfiles (.git, .env, …)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
