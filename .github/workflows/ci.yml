name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in public/js/*.js public/sw.js scripts/*.mjs; do node --check "$f"; done
      - name: Consistency checks (i18n, versions, file references)
        run: node scripts/check.mjs
      - name: Shell syntax
        run: sh -n docker/40-site-url.sh

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t archon-neo:ci .
      - name: Smoke test
        run: sh scripts/smoke-test.sh archon-neo:ci
